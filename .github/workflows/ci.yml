name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Changelog - ver docs/CI-CD.md (vault local, nao versionado neste repo)
      - name: Validar atualizacao do CHANGELOG.md
        # So no PR story -> develop/main, ver docs/CI-CD.md "Quais passos rodam em qual PR":
        # a linha de cada subtask nasce (via jira_story.py) antes da branch daquela subtask
        # existir, entao o diff de uma PR subtask/ -> story nunca toca CHANGELOG.md por
        # sequenciamento, nao por esquecimento real - exigir o toque tambem ali quebraria
        # todo PR de subtask.
        if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/validate-changelog.sh CHANGELOG.md

      # 2. Chaves de traducao - ver docs/CONVENTIONS.md secao "Internacionalizacao (i18n)"
      # Formato JSON (decisao registrada em docs/DECISIONS-LOG.md - vault local)
      - name: Validar chaves de traducao (pt-BR/en-US/es)
        # Guarda propria (locales/pt-BR.json), independente do pyproject.toml que guarda os
        # passos 3-5: feat-001 deste servico foi dividida em subtasks incrementais e
        # pyproject.toml nasce antes de locales/ existir - guardar so por pyproject.toml
        # quebraria o PR da subtask de bootstrap por sequenciamento, nao por defeito real
        # (mesma armadilha ja documentada em docs/CI-CD.md, corrigida proativamente aqui).
        # Caminho movido para dentro do pacote (feat-008, 2026-09-10): o antigo locales/ na
        # raiz do repositorio nunca era instalado com o pacote (path relativo em i18n.py so
        # funcionava com install editable) - achado real testando o container de producao.
        if: hashFiles('src/telegram_integration/locales/pt-BR.json') != ''
        run: |
          python3 .github/scripts/validate-i18n-keys.py --format json \
            --file pt-BR=src/telegram_integration/locales/pt-BR.json \
            --file en-US=src/telegram_integration/locales/en-US.json \
            --file es=src/telegram_integration/locales/es.json

      - name: Instalar uv
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - uses: actions/setup-python@v5
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: "3.12"

      # 3. Build (instalacao de dependencias + lint, equivalente pratico de "build" em Python)
      - name: Build
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('pyproject.toml') != ''
        run: |
          uv sync --no-build --locked
          uv run --no-build --locked ruff check .

      # 4. Testes unitarios + cobertura
      - name: Instalar Tesseract OCR (feat-002 - extracao de bilhete via foto)
        # Guarda propria por ocr.py (existe a partir de feat-002.2) - sem isso o teste de
        # OCR falha com "tesseract is not installed" no runner, que nao tem o binario por
        # padrao (so pip instala o wrapper Python, nao o motor de OCR em si).
        if: hashFiles('src/telegram_integration/ocr.py') != ''
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Testes unitarios e cobertura
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('pyproject.toml') != ''
        run: uv run --no-build --locked pytest --cov=. --cov-report=xml

      # 5. Qualidade de codigo e cobertura (SonarCloud)
      - name: SonarCloud
        # Pulado em PR de subtask: cobertura parcial de uma feature em andamento
        # reprovaria o quality gate sem indicar defeito real.
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('pyproject.toml') != '' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main')
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # sonar.qualitygate.wait pulado em qualquer push direto (main incluso) - mesma causa
          # raiz do passo 6: a API do plano gratuito recusa computar o gate fora de PR (primeira
          # analise de uma branch longa nova sem leak period definido devolve "NONE" em vez de
          # "OK"/"ERROR", e o plugin trata como reprovado). Sem o skip, o passo sempre passaria
          # mesmo com o gate reprovado, ja que o scanner so envia os dados e nao espera o
          # processamento assincrono do lado do SonarCloud. Ver docs/CI-CD.md.
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            ${{ github.event_name != 'push' && '-Dsonar.qualitygate.wait=true' || '' }}

      # 6. Gate de issue/hotspot do SonarCloud - pulado em qualquer push direto (mesmo racional do passo 5)
      - name: Validar zero issues no SonarCloud
        if: hashFiles('pyproject.toml') != '' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main') && github.event_name != 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          python3 .github/scripts/validate-sonar-issues.py
          --project-key eimmig_sv-telegram-integration-backend
          ${{ github.event_name == 'pull_request' && format('--pull-request {0}', github.event.pull_request.number) || format('--branch {0}', github.ref_name) }}

  build-and-push-image:
    needs: pipeline
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/eimmig/sv-telegram-integration-backend:${{ github.sha }}
            ghcr.io/eimmig/sv-telegram-integration-backend:latest

  deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # kubectl ja vem preinstalado no runner ubuntu-latest - sem action de terceiro
      - name: Configurar kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"

      - name: Reiniciar deployment
        run: kubectl rollout restart deployment/telegram-integration

  release:
    needs: pipeline
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      # Calcula a proxima versao a partir de Conventional Commits desde a ultima tag - so
      # calcula, nao cria a tag (isso e o passo "Criar tag e GitHub Release" mais abaixo).
      # github.token de leitura basta aqui, nada disto e bloqueado por branch protection.
      - name: Calcular proxima versao (Conventional Commits)
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: main
          noVersionBumpBehavior: patch

      - name: Atualizar versao no pyproject.toml
        run: uv version ${{ steps.semver.outputs.nextStrict }}

      - name: Validar TOML do pyproject.toml apos o bump
        run: python3 -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"

      - name: Cortar CHANGELOG.md
        run: python3 .github/scripts/cut-changelog.py CHANGELOG.md ${{ steps.semver.outputs.nextStrict }}

      # main tem required status check "pipeline" - o GITHUB_TOKEN padrao roda como
      # github-actions[bot], que nao e admin e seria rejeitado empurrando um commit novo
      # (nenhum check rodou pra ele ainda). RELEASE_TOKEN (PAT do dono/admin, ver
      # docs/pipeline-ci-cd.md) bypassa isso do mesmo jeito que um push manual do dono
      # bypassaria - usado so aqui, embutido na URL (vida curta de um comando), nunca
      # persistido no credential helper (persist-credentials: false acima). [skip ci] evita
      # o loop: PAT (diferente de GITHUB_TOKEN) dispara o workflow de novo por padrao.
      - name: Commit e push da release
        id: release-commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NEXT_VERSION: ${{ steps.semver.outputs.next }}
        run: |
          git add pyproject.toml uv.lock CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $NEXT_VERSION [skip ci]"
            git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # commit: aponta explicitamente pro commit que acabou de ser empurrado (o bump) -
      # sem isso a action usaria o commit que disparou o job, ANTES do bump.
      - name: Criar tag e GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.semver.outputs.next }}
          name: ${{ steps.semver.outputs.next }}
          commit: ${{ steps.release-commit.outputs.sha }}
          token: ${{ github.token }}
          generateReleaseNotes: true
