# sonar.organization e passado via -D pelo workflow (.github/workflows/ci.yml), nao aqui -
# sonar-project.properties nao interpola variavel de ambiente.
sonar.projectKey=sv-telegram-integration-backend
sonar.sources=.
sonar.exclusions=**/tests/**,**/.venv/**
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
